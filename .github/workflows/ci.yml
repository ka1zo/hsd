name: HSD cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2025
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Prevent idle MSBuild workers from locking scikit-build-core's temporary wheel build directory.
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install SQLCipher on macOS
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config sqlcipher

      - name: Install SQLCipher on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsqlcipher-dev libssl-dev libegl1

      - name: Install SQLCipher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlcipher:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build C++ and run CTest on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Build C++ and run CTest on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install HSD and ML dependencies on macOS/Linux
        if: runner.os != 'Windows'
        run: python -m pip install -e '.[ml,desktop]'

      - name: Build source-installable wheel on macOS/Linux
        if: runner.os != 'Windows'
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Build source-installable wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = (Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake').Replace('\', '/')
          $env:CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$toolchain -DVCPKG_TARGET_TRIPLET=x64-windows-static-md"
          python -m pip wheel --no-deps --wheel-dir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install built wheel on macOS/Linux
        if: runner.os != 'Windows'
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Install built wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw 'No built wheel found' }
          python -m pip install --force-reinstall "${wheel}[ml,desktop]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch and verify pinned model
        run: python -m scripts.fetch_model --dest models/e5-small

      - name: Run Python tests with local model
        env:
          HSD_TEST_MODEL_DIR: models/e5-small
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests/python -v

      - name: Evaluate retrieval quality and latency
        run: python -m benchmarks.stage8_eval --model-dir models/e5-small --k 3 --repeats 10 --output stage8-results.json

      - name: Add evaluation to job summary
        run: python -m scripts.report_metrics stage8-results.json
